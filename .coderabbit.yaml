# CodeRabbit configuration - applies once the GitHub App is installed on the
# repo (https://github.com/apps/coderabbitai). Until then the auto-assign
# workflow only leaves a notice instead of a forever-pending check.
language: de-DE
early_access: false

reviews:
  # The vendored Java sources are the 1:1 reference - never review them, only
  # the C port that mirrors them.
  path_filters:
    - "!vendor/**"
    - "!cmake-build-*/**"
  review_status: true
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

chat:
  auto_reply: true
