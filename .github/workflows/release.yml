name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/portable-release.yml
    with:
      version: ${{ github.ref_name }}
      channel: stable
      draft: false
      prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
    secrets: inherit
