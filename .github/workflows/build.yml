name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc gdb zlib1g-dev libglfw3-dev xvfb file

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matticraft-${{ matrix.os }}
          path: |
            build/client/matticraft
            build/runClient
            mods/*.so
          if-no-files-found: warn
          retention-days: 7

  smoke:
    name: Client smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc zlib1g-dev libglfw3-dev xvfb file

      - name: Configure + build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j "$(nproc)" --target runClient build_mods

      - name: Run client boot (headless)
        run: |
          xvfb-run -a ./build/runClient \
            --launchTarget neoforge --gameDir . \
            --version 1.21.11 --fml.neoForgeVersion 21.11.45 \
            --fml.mcVersion 1.21.11 --fml.neoFormVersion 20251209.172050 \
            --no-tests &
          CLIENT_PID=$!
          sleep 25
          kill $CLIENT_PID 2>/dev/null || true
          wait $CLIENT_PID 2>/dev/null || true
          echo "Client boot smoke test finished"

  lint:
    name: Lint (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting (library, client, tests, mods)
        run: |
          set +e
          find library client tests mods -name '*.c' -o -name '*.h' | \
            xargs clang-format --dry-run --Werror 2> clang-format.log
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::warning::clang-format found differences (non-blocking):"
            head -50 clang-format.log || true
          fi
          # Non-blocking: the port keeps upstream formatting 1:1, format fixes
          # must never race with the port work.
          exit 0
