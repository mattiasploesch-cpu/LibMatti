name: Portable Release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version"
        required: false
        default: "0.1.0"
        type: string
      channel:
        description: "Release channel"
        required: false
        default: "nightly"
        type: string
      draft:
        description: "Create a draft release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean
      update_nixpkgs:
        description: "Update the nixpkgs package branch/PR"
        required: false
        default: false
        type: boolean
    secrets:
      NIXPKGS_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "0.1.0"
      channel:
        description: "Release channel"
        required: true
        default: "nightly"
        type: choice
        options: [nightly, beta, stable]
      draft:
        description: "Create a draft release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean
      update_nixpkgs:
        description: "Update the nixpkgs package branch/PR (requires NIXPKGS_TOKEN and NIXPKGS_FORK)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  MATTI_VERSION: ${{ inputs.version || github.ref_name }}
  MATTI_CHANNEL: ${{ inputs.channel || 'nightly' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libvulkan-dev \
            libglfw3-dev zlib1g-dev libgl1-mesa-dev pkg-config zstd rpm msitools \
            genisoimage libfuse2 patchelf zip squashfs-tools desktop-file-utils
      - name: Install release packaging tools
        run: |
          set -euo pipefail
          NFPM_VERSION=2.49.0
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 180 \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" |
            sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 180 \
            -o /tmp/appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          ( cd /tmp && /tmp/appimagetool.AppImage --appimage-extract >/dev/null )
          sudo install -m 0755 /tmp/squashfs-root/usr/bin/appimagetool /usr/local/bin/appimagetool
          rm -rf /tmp/squashfs-root /tmp/appimagetool.AppImage
          appimagetool --version
      - name: Configure and build
        run: |
          cmake --preset linux-x64
          cmake --build --preset linux-x64 -j "$(nproc)"
      - name: Portable + system packages + AppImage
        run: |
          BUILD_DIR=build/linux-x64 VERSION="$MATTI_VERSION" packaging/linux/portable.sh
          BUILD_DIR=build/linux-x64 VERSION="$MATTI_VERSION" packaging/linux/libmatti.sh
          BUILD_DIR=build/linux-x64 VERSION="$MATTI_VERSION" packaging/linux/nfpm.sh
          BUILD_DIR=build/linux-x64 VERSION="$MATTI_VERSION" packaging/linux/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MinGW-w64 and Rust
        run: |
          APT_OPTS=(-o Acquire::Retries=4 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          # Only the x86_64 toolchain is needed. The mingw-w64 metapackage also
          # pulls the i686 and win32 variants (293 MB) and repeatedly stalled
          # on the runner's slow archive mirror.
          PACKAGES=(cmake ninja-build gcc-mingw-w64-x86-64 libz-mingw-w64-dev wixl)
          sudo timeout 300 apt-get "${APT_OPTS[@]}" update
          sudo timeout 900 env DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" \
            install -y --no-install-recommends "${PACKAGES[@]}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Configure and cross-build
        run: |
          cmake -S . -B build/windows-mingw-x64 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DMATTI_BUILD_LAUNCHER=OFF
          cmake --build build/windows-mingw-x64 \
            --target matticraft vulkancraft runClient vulkanClient matti_shared -j "$(nproc)"
      - name: Build the Windows launcher
        run: |
          cargo build --manifest-path launchers/Cargo.toml --release \
            --target x86_64-pc-windows-gnu -p launcher-desktop
      - name: Build MSI on Linux
        run: |
          BUILD_DIR=build/windows-mingw-x64 VERSION="$MATTI_VERSION" \
            LAUNCHER_BIN=launchers/target/x86_64-pc-windows-gnu/release/matticraft-launcher.exe \
            packaging/windows/build-msi-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          # Homebrew's auto-update was taking >25 minutes on the Intel runner.
          # Vulkan/MoltenVK are optional here; the macOS default is SDL + OpenGL.
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install cmake ninja pkg-config glfw sdl3 zlib
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure and build
        run: |
          cmake -S . -B build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build/macos -j "$(sysctl -n hw.ncpu)"
      - name: Build the app bundle, ZIP and DMG
        run: |
          BUILD_DIR=build/macos VERSION="$MATTI_VERSION" ARCH="${{ matrix.arch }}" \
            packaging/macos/dmg.sh
          ditto -c -k --keepParent dist/Matticraft.app \
            "dist/Matticraft-${MATTI_VERSION}-macos-${{ matrix.arch }}.zip"
          # The .app directory is a build input, not a release asset. Keeping it
          # in dist/ made actions/upload-artifact flatten every binary, PNG and
          # TTF inside the bundle into the release root.
          rm -rf dist/Matticraft.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK and Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          # The vendor submodules ship unrelated historical wrapper JARs;
          # this job runs the pinned Gradle distribution, not those wrappers.
          validate-wrappers: false
      - name: Build APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p library/src/mobile \
            -PmattiVersion="${MATTI_VERSION#v}" \
            :mobile_client:assembleRelease :mobile_client:bundleRelease --no-daemon
          mkdir -p dist
          APK="$(find library/src/mobile/mobile_client/build/outputs/apk/release -name '*.apk' -print -quit)"
          AAB="$(find library/src/mobile/mobile_client/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" "dist/Matticraft-${MATTI_VERSION}-android.apk"
          cp "$AAB" "dist/Matticraft-${MATTI_VERSION}-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: dist/*
          if-no-files-found: error

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and lint the window crate
        run: |
          cargo fmt --manifest-path library/src/libmatti/rs/Cargo.toml -- --check
          cargo clippy --manifest-path library/src/libmatti/rs/Cargo.toml -- -D warnings
          cargo test --manifest-path library/src/libmatti/rs/Cargo.toml

  release:
    needs: [linux, windows, macos, android, rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums and manifest
        run: |
          RELEASE_VERSION="${MATTI_VERSION#v}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          # Artifacts are downloaded as artifacts/<name>/<file>. macОS used to
          # upload the whole .app tree, which flattened Mach-O binaries and
          # image/font resources into the release root. Only real packages are
          # release assets now.
          find artifacts -type d -name 'Matticraft.app' -exec rm -rf {} +
          find artifacts -type f -exec cp {} dist/ \;
          for loose in '*.png' '*.ttf' '*.dylib' 'Info.plist' 'Matticraft' 'vulkancraft'; do
            if find artifacts -type f -name "$loose" | grep -q .; then
              echo "refusing loose macOS payload in release: $loose" >&2
              exit 1
            fi
          done
          MATTI_RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            python3 tools/make_update_manifest.py \
              --dist dist \
              --version "$RELEASE_VERSION" \
              --channel "$MATTI_CHANNEL" \
              --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}" \
              --out dist/latest.json
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' |
            sort | xargs sha256sum > SHA256SUMS)
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION}"
          # Old draft releases with this tag are leftovers from earlier runs.
          # Delete them before the uploader runs; otherwise its parallel
          # uploads race with the stale files and fail with already_exists.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\" and .draft) | .id" |
          while read -r id; do
            if [ -n "$id" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            fi
          done
          # A published release is kept, but its old assets are removed so
          # the upload sees no stale PNG/TTF/Mach-O files or duplicate archives.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\" and (.draft | not)) | .id" |
          while read -r id; do
            [ -z "$id" ] && continue
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${id}/assets?per_page=100" \
              --jq '.[].id' |
            while read -r asset; do
              if [ -n "$asset" ]; then
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"
              fi
            done
          done
      - uses: softprops/action-gh-release@v2
        with:
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/*
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Matticraft ${{ env.RELEASE_VERSION }}

  nixpkgs:
    if: ${{ inputs.update_nixpkgs || vars.NIXPKGS_AUTO_UPDATE == 'true' }}
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Resolve source hash
        id: source
        run: |
          URL="https://codeload.github.com/${GITHUB_REPOSITORY}/legacy.tar.gz/${GITHUB_SHA}"
          HASH="$(nix hash convert --hash-algo sha256 --to sri \
            "$(nix-prefetch-url "$URL")")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
      - name: Check out the nixpkgs fork
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NIXPKGS_FORK }}
          token: ${{ secrets.NIXPKGS_TOKEN }}
          path: nixpkgs
          fetch-depth: 0
      - name: Update the nixpkgs branch and PR
        env:
          GH_TOKEN: ${{ secrets.NIXPKGS_TOKEN }}
          NIXPKGS_FORK: ${{ vars.NIXPKGS_FORK }}
        run: |
          if [ -z "${NIXPKGS_FORK:-}" ]; then
            echo "set the repository variable NIXPKGS_FORK to <owner>/nixpkgs" >&2
            exit 1
          fi
          tools/update-nixpkgs.sh --nixpkgs nixpkgs \
            --version "${MATTI_VERSION#v}" \
            --rev "$GITHUB_SHA" \
            --source-url "${{ steps.source.outputs.url }}" \
            --hash "${{ steps.source.outputs.hash }}" \
            --branch "matticraft-${MATTI_VERSION#v}" \
            --fork "$NIXPKGS_FORK" --push --pr
