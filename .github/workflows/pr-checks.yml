name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: PR report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff statistics
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          echo "### Diff summary" > pr-report.md
          echo '```' >> pr-report.md
          git diff --stat "$BASE_SHA".."${HEAD_SHA}" | tail -5 >> pr-report.md || true
          echo '```' >> pr-report.md
          cat pr-report.md

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc zlib1g-dev libglfw3-dev file

      - name: Build + tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j "$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Annotate build results
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-log
          path: build/CMakeFiles/*.log
          if-no-files-found: ignore
          retention-days: 3
