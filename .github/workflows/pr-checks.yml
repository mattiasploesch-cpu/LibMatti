name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: PR report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Diff statistics
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          echo "### Diff summary" > pr-report.md
          echo '```' >> pr-report.md
          git diff --stat "$BASE_SHA".."$HEAD_SHA" | tail -5 >> pr-report.md || true
          echo '```' >> pr-report.md
          cat pr-report.md

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc zlib1g-dev libglfw3-dev xvfb file

      - name: Build + tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j "$(nproc)"
          xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build --output-on-failure

      - name: Client smoke test
        run: |
          # The client must reach the running game skeleton without a
          # hanging window: the run is time-boxed and the log is scanned
          # for the milestone (FML up, window created, skeleton running).
          # The timeout kill is the expected end of the run.
          run_client() {
            timeout -k 5 40 env CI=1 xvfb-run -a -s "-screen 0 1280x1024x24" \
              ./build/client/matticraft --launchTarget neoforge --gameDir "$1" \
              --version 1.21.11 > client-run.log 2>&1 || true
          }
          run_client "$(mktemp -d)"
          grep -q "Running Minecraft (skeleton)" client-run.log || {
            echo "client did not reach the game skeleton:"; tail -40 client-run.log; exit 1; }
          echo "client smoke test passed"

      - name: Upload the client log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-run-log
          path: client-run.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Annotate build results
        uses: actions/upload-artifact@v7
        with:
          name: pr-build-log
          path: build/CMakeFiles/*.log
          if-no-files-found: ignore
          retention-days: 3
