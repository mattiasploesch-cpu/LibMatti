name: Auto Assign

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    name: Assign author + reviewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assign the author, request the CodeRabbit review
        uses: actions/github-script@v9
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [author]
            });
            // CodeRabbit reviews every PR automatically - the GitHub App
            // must be installed on the repo. Requesting the reviewer here
            // left a forever-pending check behind when the app is missing,
            // so the install is required instead of a reviewer request.
            core.notice('CodeRabbit: install the GitHub App from https://github.com/apps/coderabbitai to enable automatic reviews.');
