name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.21.11-r1). Used for the tag and the artifact names.'
        required: true
        default: '1.21.11-r1'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/portable-release.yml
    with:
      version: ${{ inputs.version }}
      channel: stable
      draft: false
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit
