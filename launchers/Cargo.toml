[workspace]
resolver = "2"
members = ["launcher-core", "desktop", "macos"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
repository = "https://github.com/mattiasploesch-cpu/LibMatti"

[workspace.dependencies]
launcher-core = { path = "launcher-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
ring = "0.17"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
egui = "0.31.1"
